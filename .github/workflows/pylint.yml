name: Pylint

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Install Pylint
        run: python -m pip install --upgrade pylint
      - name: Check fatal and error-level issues
        run: >-
          pylint $(git ls-files '*.py')
          --errors-only
          --disable=import-error,no-self-argument
