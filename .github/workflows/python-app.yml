# Validate Python sources without importing hardware-only dependencies.
name: Python application

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Install lint tools
        run: python -m pip install --upgrade flake8
      - name: Check syntax and undefined names
        run: >-
          flake8 active_vision_dist
          --count
          --select=E9,F63,F7,F82
          --show-source
          --statistics
      - name: Compile Python sources
        run: python -m compileall -q active_vision_dist
