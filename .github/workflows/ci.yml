name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Install linters
        run: python -m pip install --upgrade flake8 pylint
      - name: Flake8 — syntax & undefined names
        run: flake8 active_vision_dist --count --select=E9,F63,F7,F82 --show-source --statistics
      - name: Compile Python sources
        run: python -m compileall -q active_vision_dist
      - name: Pylint — errors only
        run: pylint active_vision_dist --errors-only --disable=import-error,no-self-argument
